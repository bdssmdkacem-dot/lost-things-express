name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Keep the same debug signing certificate between CI builds. Without this,
      # a newly generated keystore signs every APK with a different certificate and
      # Android may reject an update as an invalid package.
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lost-things-express-android-debug-keystore-v1

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install Godot 4.3 and export templates
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Configure Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

      - name: Verify Android export tooling
        run: |
          set -euxo pipefail
          godot --version
          test -f project.godot
          test -f export_presets.cfg
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -x "$ANDROID_HOME/build-tools/34.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt"
          mkdir -p build "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey

      - name: Import project resources (15 minute limit)
        run: timeout --signal=TERM --kill-after=30s 15m godot --headless --editor --path . --quit --verbose

      - name: Validate game scene (2 minute limit)
        run: timeout --signal=TERM --kill-after=15s 2m godot --headless --path . --quit-after 5 --verbose

      - name: Configure Godot Android and Java paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "Configured Android SDK: $ANDROID_HOME"
          echo "Configured Java SDK: $JAVA_HOME"
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Export signed Android APK
        run: |
          set -euxo pipefail
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          godot --headless --path . --export-debug "Android" build/TheLostThingsExpress.apk --verbose
          test -s build/TheLostThingsExpress.apk

      - name: Validate APK signature, alignment, package and native library
        run: |
          set -euxo pipefail
          APK="build/TheLostThingsExpress.apk"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee build/apk-badging.txt
          grep -F "package: name='com.lostthingsexpress.game'" build/apk-badging.txt
          grep -F "versionCode='3' versionName='0.1.2'" build/apk-badging.txt
          unzip -l "$APK" > build/apk-contents.txt
          grep -F 'AndroidManifest.xml' build/apk-contents.txt
          grep -F 'lib/arm64-v8a/libgodot_android.so' build/apk-contents.txt
          sha256sum "$APK" | tee build/apk-sha256.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | tee build/apk-certificate.txt

      - name: Install and launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          disable-animations: true
          script: |
            set -euxo pipefail
            adb wait-for-device
            adb logcat -c
            adb install -r build/TheLostThingsExpress.apk
            adb shell monkey -p com.lostthingsexpress.game 1
            sleep 12
            adb shell pidof com.lostthingsexpress.game
            adb exec-out screencap -p > build/android-emulator-screenshot.png
            test -s build/android-emulator-screenshot.png
            adb logcat -d -t 5000 > build/android-emulator-logcat.txt
            if grep -E "FATAL EXCEPTION|ANR in com.lostthingsexpress.game|INSTALL_FAILED" build/android-emulator-logcat.txt; then
              echo "Android emulator smoke test failed."
              exit 1
            fi

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lost-things-express-emulator-diagnostics
          path: |
            build/android-emulator-screenshot.png
            build/android-emulator-logcat.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload verified installable APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Lost-Things-Express-Android-APK
          path: build/TheLostThingsExpress.apk
          if-no-files-found: error
          retention-days: 14
