name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Godot 4.3 and export templates
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: true

      - name: Configure Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

      - name: Verify Android export tooling
        run: |
          godot --version
          test -f project.godot
          test -f export_presets.cfg
          mkdir -p build

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Validate game scene
        run: godot --headless --path . --quit-after 5

      - name: Export Android APK
        run: |
          godot --headless --path . --export-debug "Android" build/TheLostThingsExpress.apk
          test -s build/TheLostThingsExpress.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Lost-Things-Express-Android-APK
          path: build/TheLostThingsExpress.apk
          if-no-files-found: error
          retention-days: 14
