name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  godot-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required project files
        run: |
          test -f project.godot
          test -f scenes/main.tscn
          test -f scripts/main.gd
          test -f docs/ART_DIRECTION.md
          test -f docs/BLENDER_PIPELINE.md
          test -f art/blender/create_train_carriage.py
          test -f docs/GAME_DESIGN.md
          echo "Required project files are present."

      - name: Check main scene wiring
        run: |
          grep -q 'run/main_scene="res://scenes/main.tscn"' project.godot
          grep -q 'path="res://scripts/main.gd"' scenes/main.tscn
          echo "Main scene configuration looks valid."

      - name: Validate Blender generator syntax
        run: |
          python -m py_compile art/blender/create_train_carriage.py
          grep -q "TRAIN_CARRIAGE_ASSET_CREATED" art/blender/create_train_carriage.py
          echo "Blender generator syntax and export marker look valid."

      - name: Install Blender for asset generation
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Generate first carriage assets in Blender
        run: |
          blender --background --python art/blender/create_train_carriage.py
          test -s assets/blender/train_carriage.blend
          test -s assets/models/train_carriage.glb
          echo "Blender source and GLB export were generated."

      - name: Upload generated carriage assets
        uses: actions/upload-artifact@v4
        with:
          name: lost-things-express-carriage-assets
          path: |
            assets/blender/train_carriage.blend
            assets/models/train_carriage.glb
          if-no-files-found: error
          retention-days: 14

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Import project and parse scripts
        run: godot --headless --editor --path . --quit

      - name: Launch main scene headlessly
        run: godot --headless --path . --quit-after 5
