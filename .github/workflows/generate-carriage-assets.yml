name: Generate carriage art assets

on:
  workflow_dispatch:
  push:
    paths:
      - "art/blender/**"
      - "docs/BLENDER_PIPELINE.md"
      - ".github/workflows/generate-carriage-assets.yml"

permissions:
  contents: read

jobs:
  generate-carriage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender and export dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy

      - name: Generate carriage source and GLB
        run: |
          blender --background --python art/blender/create_train_carriage.py
          test -s assets/blender/train_carriage.blend
          test -s assets/models/train_carriage.glb
          echo "Generated carriage assets; visual approval is still required."

      - name: Upload generated carriage assets for review
        uses: actions/upload-artifact@v4
        with:
          name: lost-things-express-carriage-assets
          path: |
            assets/blender/train_carriage.blend
            assets/models/train_carriage.glb
          if-no-files-found: error
          retention-days: 14
