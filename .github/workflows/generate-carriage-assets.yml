name: Generate carriage art assets

on:
  workflow_dispatch:
  push:
    paths:
      - "art/blender/**"
      - "docs/BLENDER_PIPELINE.md"
      - ".github/workflows/generate-carriage-assets.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: carriage-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-carriage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Blender and export dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy libegl1 libegl-mesa0 libgl1-mesa-dri xvfb

      - name: Generate carriage source and GLB
        run: |
          LOST_THINGS_FORCE_PREVIEW=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender --background --python-exit-code 1 --python art/blender/create_train_carriage.py
          LOST_THINGS_FORCE_PREVIEW=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender --background --python-exit-code 1 --python art/blender/create_locomotive.py
          test -s assets/blender/train_carriage.blend
          test -s assets/models/train_carriage.glb
          test -s assets/blender/train_carriage_preview.png
          test -s assets/blender/lost_things_locomotive.blend
          test -s assets/models/lost_things_locomotive.glb
          test -s assets/blender/lost_things_locomotive_preview.png
          echo "Generated carriage and locomotive assets; visual approval is still required."

      - name: Validate glTF runtime material colors
        run: |
          python3 - <<'PY'
          import json
          import struct
          from pathlib import Path

          path = Path("assets/models/train_carriage.glb")
          data = path.read_bytes()
          if data[:4] != b"glTF":
              raise SystemExit("Generated carriage is not a GLB file")
          offset = 12
          gltf = None
          while offset < len(data):
              size, chunk_type = struct.unpack_from("<I4s", data, offset)
              offset += 8
              chunk = data[offset:offset + size]
              offset += size
              if chunk_type == b"JSON":
                  gltf = json.loads(chunk.decode("utf-8").rstrip("\x00 "))
                  break
          if gltf is None:
              raise SystemExit("Generated GLB has no JSON chunk")

          materials = {m.get("name", ""): m for m in gltf.get("materials", [])}
          requirements = {
              "Seats | deep emerald green leather": lambda c: c[1] > c[0] * 3 and c[1] < 0.25,
              "Mahogany": lambda c: c[0] < 0.15 and c[0] > c[1] * 2,
              "Ref Table | cream marble with soft veins": lambda c: c[0] < 0.95 and c[1] < 0.95,
          }
          for name, color_check in requirements.items():
              material = materials.get(name)
              factor = (material or {}).get("pbrMetallicRoughness", {}).get("baseColorFactor")
              if not factor or not color_check(factor):
                  raise SystemExit(f"GLB runtime color missing/invalid for {name}: {factor}")
              print(f"GLTF_MATERIAL_COLOR_OK: {name} = {factor}")
          print(f"GLTF_MATERIALS_VALIDATED: {len(materials)}")
          PY

      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false

      - name: Import generated GLB and parse project in Godot
        run: |
          godot --headless --editor --path . --quit
          test -d .godot/imported
          echo "Godot import pass completed for the generated carriage asset."

      - name: Launch the actual game scene with generated carriage
        run: godot --headless --path . --quit-after 5

      - name: Publish generated assets without binary rebase conflicts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          output_dir="$(mktemp -d)"
          trap 'rm -rf "$output_dir"' EXIT
          # Preserve freshly generated binaries outside the worktree before syncing
          # to main. Rebase cannot merge GLB/BLEND/PNG files and may race another run.
          for file in assets/blender/train_carriage.blend assets/models/train_carriage.glb assets/blender/train_carriage_preview.png assets/blender/lost_things_locomotive.blend assets/models/lost_things_locomotive.glb assets/blender/lost_things_locomotive_preview.png; do
            mkdir -p "$output_dir/$(dirname "$file")"
            cp "$file" "$output_dir/$file"
          done
          git fetch origin main
          git reset --hard origin/main
          for file in assets/blender/train_carriage.blend assets/models/train_carriage.glb assets/blender/train_carriage_preview.png assets/blender/lost_things_locomotive.blend assets/models/lost_things_locomotive.glb assets/blender/lost_things_locomotive_preview.png; do
            cp "$output_dir/$file" "$file"
          done
          git add assets/blender/train_carriage.blend assets/models/train_carriage.glb assets/blender/train_carriage_preview.png assets/blender/lost_things_locomotive.blend assets/models/lost_things_locomotive.glb assets/blender/lost_things_locomotive_preview.png
          if git diff --cached --quiet; then
            echo "Generated assets are unchanged."
          else
            git commit -m "art: publish generated carriage assets"
            git push origin HEAD:main
          fi

      - name: Trigger signed Android APK build for regenerated carriage
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android-apk.yml --ref main

      - name: Upload generated carriage assets for review
        uses: actions/upload-artifact@v4
        with:
          name: lost-things-express-carriage-assets
          path: |
            assets/blender/train_carriage.blend
            assets/models/train_carriage.glb
            assets/blender/train_carriage_preview.png
            assets/blender/lost_things_locomotive.blend
            assets/models/lost_things_locomotive.glb
            assets/blender/lost_things_locomotive_preview.png
          if-no-files-found: error
          retention-days: 14
